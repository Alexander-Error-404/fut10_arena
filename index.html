<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUT 10 Arena - Gestão Escolinha & Cantina</title>
  
  <!-- Estilos Globais e da Tela de Login -->
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
  <link rel="stylesheet" href="assets/css/utilities.css" />
</head>
<body>

  <!-- ==========================================================================
       TELA 1: LOGIN DO SISTEMA (MODO MOBILE-FIRST)
       ========================================================================== -->
  <section id="login-screen" class="login-container screen-active">
    <div class="login-card">
      
      <!-- Logo e Títulos da Aplicação -->
      <img src="assets/images/logo.png" alt="FUT 10 Arena" class="login-logo" />
      <h1 class="login-title">FUT 10 Arena</h1>
      <p class="login-subtitle">Sistema de Gestão Escolinha & Cantina</p>

      <!-- Mensagem de Erro (Alerta em Vermelho Suave) -->
      <div id="error-message" class="error-message"></div>

      <!-- Formulário de Autenticação -->
      <form id="form-login">
        
        <!-- Seleção de Operador -->
<div class="form-group">
  <label for="select-usuario">Quem está acessando?</label>
  <select id="select-usuario" class="form-control">
    <option value="" disabled selected>Selecione seu perfil...</option>
    <option value="Alessandra">Alessandra (Financeiro/Cantina)</option>
    <option value="Vinícius">Vinícius (Campo/Treinos)</option>
  </select>
</div>

<!-- Campo de Senha -->
<div class="form-group">
  <label for="input-senha">Senha de Acesso</label>
  <input 
    type="password" 
    id="input-senha" 
    class="form-control" 
    placeholder="Digite sua senha" 
  />
</div>

        <!-- Botão Principal em Destaque Vermelho -->
        <button type="submit" class="btn-login-submit">
          ENTRAR NO SISTEMA
        </button>

      </form>
      
    </div>
  </section>
  <!-- ==========================================================================
       TELA 2: ÁREA PRINCIPAL DO SISTEMA (PAINEL / APP)
       ========================================================================== -->
  <main id="app-screen" class="app-container screen-hidden">
    
    <!-- Cabeçalho Principal com Informações do Usuário Logado -->
    <header class="app-header">
      <div class="user-info">
        <span id="user-display-name" class="user-name">Usuário</span>
        <small id="user-display-role" class="user-role">Cargo</small>
      </div>
      <button id="btn-logout" class="btn-logout">Sair</button>
    </header>

    <!-- Conteúdo Dinâmico do Dashboard e Módulos -->
    <section id="main-content" class="content-area">
      <!-- O conteúdo do Dashboard/Módulos será injetado via JavaScript -->

      <!-- ================================================================= -->
<!-- BLOCO: DASHBOARD - KPIS E PAINEL DE CONTROLE                      -->
<!-- Descrição: Indicadores rápidos e atalhos de navegação.            -->
<!-- ================================================================= -->
<div id="dashboard-screen" class="dashboard-container">

  <!-- SUB-BLOCO: INDICADORES RÁPIDOS (KPIS) -->
  <div class="indicadores-container">

    <!-- KPI 1: Total de Alunos Matriculados -->
    <div class="card-indicador">
      <div class="ind-icon">👥</div>
      <div class="ind-info">
        <span id="kpi-alunos">0</span>
        <p>Alunos Matriculados</p>
      </div>
    </div>

    <!-- KPI 2: Alunos Pendentes (Alerta Amarelo/Vermelho) -->
    <div class="card-indicador border-pendente">
      <div class="ind-icon">⚠️</div>
      <div class="ind-info">
        <span id="kpi-inadimplentes">0</span>
        <p>Alunos Pendentes</p>
      </div>
    </div>

    <!-- KPI 3: Estoque Baixo da Cantina -->
    <div class="card-indicador border-estoque">
      <div class="ind-icon">🥤</div>
      <div class="ind-info">
        <span id="kpi-estoque">0</span>
        <p>Itens a Acabar (Bar)</p>
      </div>
    </div>

  </div> <!-- Fim dos Indicadores -->

  <!-- TÍTULO DA SEÇÃO DE ATALHOS -->
  <h3>Painel de Controle</h3>

  <!-- SUB-BLOCO: MENU DE ATALHOS RÁPIDOS (OS 7 BOTÕES) -->
  <div class="menu-grid">

    <!-- Atalho 1: Gerenciar Alunos (Visível para Ambos) -->
    <button type="button" class="menu-card menu-ambos" data-target="alunos">
      <div class="card-icon">👥</div>
      <div class="card-info">
        <h4>Gerenciar Alunos</h4>
        <p>Cadastro, categorias e dados dos pais</p>
      </div>
    </button>

    <!-- Atalho 2: Fazer Chamada (Exclusivo Vinícius) -->
    <button type="button" class="menu-card menu-vinicius" data-target="chamada">
      <div class="card-icon">📋</div>
      <div class="card-info">
        <h4>Fazer Chamada</h4>
        <p>Controle de presença no campo</p>
      </div>
    </button>

    <!-- Atalho 3: Barzinho / Cantina (Exclusivo Alessandra) -->
    <button type="button" class="menu-card menu-alessandra" data-target="cantina">
      <div class="card-icon">🍿</div>
      <div class="card-info">
        <h4>Barzinho / Cantina</h4>
        <p>Vendas rápidas e controle de fiado</p>
      </div>
    </button>

    <!-- Atalho 4: Mensalidades (Exclusivo Alessandra) -->
    <button type="button" class="menu-card menu-alessandra" data-target="mensalidades">
      <div class="card-icon">💰</div>
      <div class="card-info">
        <h4>Mensalidades</h4>
        <p>Controle de pagamentos (Grid Jan-Dez)</p>
      </div>
    </button>

    <!-- Atalho 5: Configurações (Exclusivo Alessandra) -->
    <button type="button" class="menu-card menu-alessandra" data-target="configuracoes">
      <div class="card-icon">⚙️</div>
      <div class="card-info">
        <h4>Configurações</h4>
        <p>Preços, atrasos e uniformes</p>
      </div>
    </button>

    <!-- Atalho 6: Financeiro / Caixa (Exclusivo Alessandra) -->
    <button type="button" class="menu-card menu-alessandra" data-target="financeiro">
      <div class="card-icon">📊</div>
      <div class="card-info">
        <h4>Financeiro / Caixa</h4>
        <p>Faturamento global e lucros</p>
      </div>
    </button>

    <!-- Atalho 7: Campo Tático (Exclusivo Vinícius) -->
    <button type="button" class="menu-card menu-vinicius" data-target="treinos">
      <div class="card-icon">⚽</div>
      <div class="card-info">
        <h4>Campo Tático</h4>
        <p>Posicionamento e treinos interativos</p>
      </div>
    </button>

  </div> <!-- Fim da Grid do Menu -->

</div> <!-- Fim da dashboard-container -->

    </section>

  </main>

  <!-- Carregamento dos Scripts JavaScript -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
